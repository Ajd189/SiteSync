<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>SiteSync internal forms</title>
  </head>
  <body>
    <form name="sitesync-lead-digest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="sitesync-lead-digest">
      <input type="hidden" name="subject" value="SiteSync daily lead digest">
      <input name="bot-field">
      <input name="batch_date">
      <input name="lead_count">
      <textarea name="lead_summary"></textarea>
    </form>
  </body>
</html>
